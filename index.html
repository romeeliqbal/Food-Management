<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <h1 class="welcome">Welcome, Enjoy your shopping.</h1>

    <div class="top">
      <input
        id="search"
        type="search"
        name=""
        id=""
        placeholder="Search your product..."
      />
      <button class="list">Shopping list</button>
      <button class="item">+ Add item</button>
      <div class="image">
        <img src="larder-logo-on-gradient.png" alt="" />
      </div>
    </div>

    <div class="stock">
      <div class="stock1">
        <h2 class="h2_24">24</h2>
        <p class="i_inStock">items in stock</p>
      </div>
      <div class="stock2">
        <h2 class="h2_24">16</h2>
        <p class="i_inStock">Fresh & cooked</p>
      </div>
    </div>
    <div class="stocking">
      <div class="stock3">
        <h2 class="h2_24">24</h2>
        <p class="i_inStock">items in stock</p>
      </div>
      <div class="stock4">
        <h2 class="h2_24">16</h2>
        <p class="i_inStock">Fresh & cooked</p>
      </div>
    </div>
    <div class="inventory">
      <h2>Your Inventory</h2>
      <div class="i_items">
        <ul>
          <li><a href="" class="all">All</a></li>
          <li><a href="">Product</a></li>
          <li><a href="">Dairy & eggs</a></li>
          <li><a href="">Pantry</a></li>
          <li><a href="">Freezer</a></li>
          <li><a href="">Mear & fish</a></li>
        </ul>
      </div>
    </div>
  </body>
</html>
